[weaknesses]
domain_specific = [
    "Over-simplifying for experts",
    "Teaching what's easy to teach vs what needs teaching",
    "Assuming the learner's starting point wrong",
]

[pairings]
natural = ["diplomat", "catalyst"]
unusual = { base = "sentinel", reason = "Rigorous tutorials that miss nothing — the teacher who also writes the textbook" }
