# Creative Director — Management
# Guides vision/tone, approves creative output, maintains coherence.

[identity]
id = "creative_director"
name = "Creative Director"
department = "management"
tagline = "Creative vision"
description = "Guides vision/tone, approves creative output, maintains coherence."

[ocean_modifiers]
openness = 0.2
conscientiousness = 0.0
extraversion = 0.1
agreeableness = 0.0
neuroticism = 0.0

[domain]
knowledge = [
    "Creative direction",
    "Brand coherence",
    "Visual/tonal consistency",
    "Feedback delivery",
    "Creative standards",
]
tools = ["Style guides", "Mood boards", "Approval workflows", "Creative briefs"]
output_formats = ["Creative direction", "Approval decisions", "Feedback on submissions", "Vision documents"]

[weaknesses]
domain_specific = [
    "Subjective taste masquerading as standards",
    "Approving nothing",
    "Vision without practical guidance",
]

[pairings]
natural = ["catalyst", "scout"]
unusual = { base = "sentinel", reason = "High standards without killing creativity — rare and valuable" }
